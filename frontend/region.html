<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지역 탐색 - 자산균형</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div style="display: flex; align-items: center; gap: 12px; padding: 20px 0;">
                <span style="font-size: 24px; cursor: pointer;" onclick="location.href='index.html'">←</span>
                <h1 style="font-size: 20px;">지역별 투자 지도</h1>
            </div>
        </header>

        <div class="glass-card">
            <input type="text" placeholder="지역명을 입력하세요 (예: 강남구, 화성시)" style="width: 100%; border: 1px solid var(--border); padding: 12px; border-radius: 12px; outline: none;">
        </div>

        <div class="glass-card">
            <h3 style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px;">🔥 지금 뜨는 지역</h3>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p style="font-weight: 700;">경기 화성시</p>
                        <p style="font-size: 12px; color: var(--text-muted);">인구 유입 증가 및 개발 호재</p>
                    </div>
                    <span style="color: var(--secondary); font-weight: 700;">▲ 2.4%</span>
                </div>
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <p style="font-weight: 700;">인천 연수구</p>
                        <p style="font-size: 12px; color: var(--text-muted);">GTX 노선 확정 및 인프라 개선</p>
                    </div>
                    <span style="color: var(--secondary); font-weight: 700;">▲ 1.8%</span>
                </div>
            </div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item" onclick="location.href='index.html'">🏠 <span>홈</span></div>
            <div class="nav-item" onclick="location.href='analysis.html'">📊 <span>분석</span></div>
            <div class="nav-item" onclick="location.href='recommendation.html'">🎯 <span>추천</span></div>
            <div class="nav-item active" onclick="location.href='region.html'">🗺 <span>지역</span></div>
            <div class="nav-item" onclick="location.href='settings.html'">👤 <span>MY</span></div>
        </nav>
    </div>
</body>
</html>
