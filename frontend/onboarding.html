<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온보딩 - 자산균형</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app-container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 40px;">
        <div style="font-size: 60px; margin-bottom: 20px;">⚖️</div>
        <h1 style="font-size: 28px; margin-bottom: 12px;">반갑습니다!</h1>
        <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 40px;">
            자산균형 AI가 당신의 데이터를 분석하여<br>최적의 리밸런싱 전략을 찾아드립니다.
        </p>

        <div class="glass-card" style="width: 100%; text-align: left; margin-bottom: 20px;">
            <label style="font-size: 12px; color: var(--text-muted);">이름</label>
            <input type="text" placeholder="홍길동" style="width: 100%; border: 0; border-bottom: 2px solid var(--primary); padding: 10px 0; font-size: 18px; outline: none;">
        </div>

        <div class="glass-card" style="width: 100%; text-align: left; margin-bottom: 40px;">
            <label style="font-size: 12px; color: var(--text-muted);">투자 성향</label>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button style="flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: white;">보수적</button>
                <button style="flex: 1; padding: 10px; border-radius: 12px; border: 2px solid var(--primary); background: #EFF6FF; color: var(--primary); font-weight: 700;">중립적</button>
                <button style="flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: white;">공격적</button>
            </div>
        </div>

        <button onclick="location.href='index.html'" style="width: 100%; background: var(--primary); color: white; border: 0; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: 800; cursor: pointer; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);">시작하기</button>
    </div>
</body>
</html>
