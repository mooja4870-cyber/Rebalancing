<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자산 입력 - 자산균형</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app-container" style="max-height: calc(100vh - 40px); overflow-y: auto; padding-bottom: 90px;">
        <header>
            <div class="greeting">
                <h1>자산 입력</h1>
                <p>내 자산, 수입, 지출, 대출정보로 바로 분석합니다.</p>
            </div>
        </header>

        <form id="assetForm" class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
            <input name="name" placeholder="이름" value="홍길동" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="age" type="number" placeholder="나이" value="60" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="monthly_income" type="number" placeholder="월수입" value="4000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="monthly_expense" type="number" placeholder="월지출" value="3200000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="risk_tolerance" type="number" min="1" max="10" placeholder="위험성향 1~10" value="5" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="financial_goal" placeholder="재무목표" value="은퇴 현금흐름 안정화" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <h3 style="font-size: 15px; margin-top: 8px;">자산 1</h3>
            <select name="asset_type_1" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;"><option value="real_estate">부동산</option><option value="finance">금융자산</option><option value="cash">현금</option></select>
            <input name="asset_name_1" placeholder="자산명" value="아파트" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="current_value_1" type="number" placeholder="현재가치" value="1600000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="debt_amount_1" type="number" placeholder="대출잔액" value="300000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="debt_interest_rate_1" type="number" step="0.1" placeholder="대출금리" value="4.5" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <h3 style="font-size: 15px; margin-top: 8px;">자산 2</h3>
            <select name="asset_type_2" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;"><option value="finance">금융자산</option><option value="real_estate">부동산</option><option value="cash">현금</option></select>
            <input name="asset_name_2" placeholder="자산명" value="예금/ETF" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="current_value_2" type="number" placeholder="현재가치" value="200000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="debt_amount_2" type="number" placeholder="대출잔액" value="0" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="debt_interest_rate_2" type="number" step="0.1" placeholder="대출금리" value="0" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <button type="submit" style="border: 0; background: var(--primary); color: white; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer;">분석 실행</button>
        </form>

        <div id="resultCard" class="glass-card" style="display: none; margin-bottom: 110px;">
            <h3 style="font-size: 16px; margin-bottom: 12px;">분석 결과</h3>
            <div id="resultBody" style="font-size: 13px; line-height: 1.7;"></div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item" onclick="location.href='index.html'">⌂ <span>홈</span></div>
            <div class="nav-item active" onclick="location.href='asset-input.html'">＋ <span>입력</span></div>
            <div class="nav-item" onclick="location.href='analysis.html'">▣ <span>분석</span></div>
            <div class="nav-item" onclick="location.href='recommendation.html'">◎ <span>추천</span></div>
        </nav>
    </div>

    <script>
        const form = document.getElementById('assetForm');
        const resultCard = document.getElementById('resultCard');
        const resultBody = document.getElementById('resultBody');

        function numberOf(formData, key) {
            return Number(formData.get(key) || 0);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const data = new FormData(form);
            const payload = {
                name: data.get('name'),
                age: numberOf(data, 'age'),
                monthly_income: numberOf(data, 'monthly_income'),
                monthly_expense: numberOf(data, 'monthly_expense'),
                risk_tolerance: numberOf(data, 'risk_tolerance'),
                financial_goal: data.get('financial_goal'),
                assets: [1, 2].map((idx) => ({
                    asset_type: data.get(`asset_type_${idx}`),
                    asset_name: data.get(`asset_name_${idx}`),
                    current_value: numberOf(data, `current_value_${idx}`),
                    debt_amount: numberOf(data, `debt_amount_${idx}`),
                    debt_interest_rate: numberOf(data, `debt_interest_rate_${idx}`)
                })).filter((asset) => asset.current_value > 0)
            };

            const response = await fetch('/api/v1/users/analysis-input', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const report = await response.json();

            if (!response.ok) {
                resultBody.textContent = report.detail || '분석에 실패했습니다.';
                resultCard.style.display = 'block';
                return;
            }

            const summary = report.summary;
            const simulation = report.simulation;
            const plan = report.recommendation.action_plan.map((item) => `<li>${item}</li>`).join('');
            resultBody.innerHTML = `
                <p><b>건전성 점수</b>: ${summary.health_score}/100</p>
                <p><b>총자산</b>: ${Math.round(summary.total_assets).toLocaleString()}원</p>
                <p><b>총대출</b>: ${Math.round(summary.total_debt).toLocaleString()}원</p>
                <p><b>월 현금흐름</b>: ${Math.round(summary.monthly_cashflow).toLocaleString()}원</p>
                <p><b>30년 생존확률</b>: ${simulation.survival_probability.toFixed(1)}%</p>
                <ul style="margin-top: 10px; padding-left: 18px;">${plan}</ul>
            `;
            resultCard.style.display = 'block';
        });
    </script>
</body>
</html>
