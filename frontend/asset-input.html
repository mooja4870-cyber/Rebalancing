<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자산 입력 - 자산균형</title>
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="app-container" style="max-height: calc(100vh - 40px); overflow-y: auto; padding-bottom: 90px;">
        <header>
            <div class="greeting">
                <h1>자산 입력</h1>
                <p>필수 항목을 입력하면 맞춤 분석보고서를 만듭니다.</p>
            </div>
        </header>

        <form id="assetForm" class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
            <h3 style="font-size: 15px;">기본 정보</h3>
            <input name="name" placeholder="이름" value="홍길동" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="age" type="number" placeholder="나이" value="60" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="family_count" type="number" placeholder="가족수" value="3" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="family_ages" placeholder="가족 나이: 예) 60,58,28" value="60,58,28" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="retirement_goal" placeholder="은퇴목표" value="월 400만원 현금흐름 유지" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">

            <h3 style="font-size: 15px; margin-top: 8px;">수입/지출/대출</h3>
            <input name="monthly_income" type="number" placeholder="월수입" value="4000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="monthly_expense" type="number" placeholder="월지출" value="3200000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="loan_balance" type="number" placeholder="대출잔액" value="300000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="loan_interest_rate" type="number" step="0.1" placeholder="대출금리" value="4.5" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="risk_tolerance" type="number" min="1" max="10" placeholder="위험성향 1~10" value="5" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">

            <h3 style="font-size: 15px; margin-top: 8px;">자산 현황</h3>
            <input name="real_estate" type="number" placeholder="부동산" value="1600000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="deposit" type="number" placeholder="예금" value="120000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="stock" type="number" placeholder="주식" value="60000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="gold_silver" type="number" placeholder="금/은" value="20000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">
            <input name="pension" type="number" placeholder="연금" value="180000000" style="padding: 12px; border: 1px solid #E2E8F0; border-radius: 12px;">

            <button type="submit" style="border: 0; background: var(--primary); color: white; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer;">분석보고서 만들기</button>
        </form>

        <div id="resultCard" class="glass-card" style="display: none; margin-bottom: 110px;">
            <h3 style="font-size: 16px; margin-bottom: 12px;">분석보고서</h3>
            <div id="resultBody" style="font-size: 13px; line-height: 1.7;"></div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item" onclick="location.href='index.html'">⌂ <span>홈</span></div>
            <div class="nav-item active" onclick="location.href='asset-input.html'">＋ <span>입력</span></div>
            <div class="nav-item" onclick="location.href='analysis.html'">▣ <span>분석</span></div>
            <div class="nav-item" onclick="location.href='recommendation.html'">◎ <span>추천</span></div>
        </nav>
    </div>

    <script>
        const form = document.getElementById('assetForm');
        const resultCard = document.getElementById('resultCard');
        const resultBody = document.getElementById('resultBody');

        function numberOf(formData, key) {
            return Number(formData.get(key) || 0);
        }

        function agesOf(value) {
            return String(value || '').split(',').map((age) => Number(age.trim())).filter((age) => age > 0);
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const data = new FormData(form);
            const payload = {
                name: data.get('name'),
                age: numberOf(data, 'age'),
                monthly_income: numberOf(data, 'monthly_income'),
                monthly_expense: numberOf(data, 'monthly_expense'),
                loan_balance: numberOf(data, 'loan_balance'),
                loan_interest_rate: numberOf(data, 'loan_interest_rate'),
                family_count: numberOf(data, 'family_count'),
                family_ages: agesOf(data.get('family_ages')),
                retirement_goal: data.get('retirement_goal'),
                risk_tolerance: numberOf(data, 'risk_tolerance'),
                assets: [
                    {asset_type: 'real_estate', asset_name: '부동산', current_value: numberOf(data, 'real_estate')},
                    {asset_type: 'deposit', asset_name: '예금', current_value: numberOf(data, 'deposit')},
                    {asset_type: 'stock', asset_name: '주식', current_value: numberOf(data, 'stock')},
                    {asset_type: 'gold_silver', asset_name: '금/은', current_value: numberOf(data, 'gold_silver')},
                    {asset_type: 'pension', asset_name: '연금', current_value: numberOf(data, 'pension')}
                ].filter((asset) => asset.current_value > 0)
            };

            const response = await fetch('/api/v1/users/analysis-input', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const report = await response.json();

            if (!response.ok) {
                resultBody.textContent = report.detail || '분석에 실패했습니다.';
                resultCard.style.display = 'block';
                return;
            }

            const summary = report.summary;
            const analysis = report.analysis_report;
            const simulation = report.simulation;
            const breakdown = Object.entries(summary.asset_breakdown).map(([label, item]) => `<li>${label}: ${Math.round(item.value).toLocaleString()}원 (${item.ratio}%)</li>`).join('');
            const risks = analysis.risk_flags.map((item) => `<li>${item}</li>`).join('');
            const plan = report.recommendation.action_plan.map((item) => `<li>${item}</li>`).join('');
            resultBody.innerHTML = `
                <p><b>${analysis.headline}</b></p>
                <p><b>상태</b>: ${analysis.status} / 건전성 ${summary.health_score}/100</p>
                <p>${analysis.asset_comment}</p>
                <ul style="margin: 8px 0 8px 18px;">${breakdown}</ul>
                <p>${analysis.cashflow_comment}</p>
                <p>${analysis.debt_comment}</p>
                <p><b>가족</b>: ${analysis.family_comment}</p>
                <p><b>은퇴목표</b>: ${analysis.retirement_goal_comment}</p>
                <p><b>30년 자산 생존확률</b>: ${simulation.survival_probability.toFixed(1)}%</p>
                <p style="margin-top: 10px;"><b>위험 체크</b></p>
                <ul style="margin: 8px 0 8px 18px;">${risks}</ul>
                <p><b>실행 제안</b></p>
                <ul style="margin-top: 8px; padding-left: 18px;">${plan}</ul>
            `;
            resultCard.style.display = 'block';
        });
    </script>
</body>
</html>
