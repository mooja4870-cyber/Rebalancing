<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자산 입력 - 자산균형</title>
    <link rel="stylesheet" href="css/index.css">
    <style>
        .input-page {
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            padding-bottom: 116px;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .field label {
            font-size: 13px;
            font-weight: 800;
            color: var(--text-main);
        }

        .field small {
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .field input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            background: #fff;
        }

        .field input:focus {
            outline: 2px solid rgba(37, 99, 235, 0.18);
            border-color: var(--primary);
        }

        .required {
            color: var(--danger);
        }

        .section-title {
            font-size: 16px;
            margin-top: 6px;
        }

        .submit-button {
            border: 0;
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-size: 15px;
        }

        .report-list {
            margin: 8px 0 8px 18px;
        }
    </style>
</head>
<body>
    <div class="app-container input-page">
        <header>
            <div class="greeting">
                <h1>자산 입력</h1>
                <p>항목명을 보고 하나씩 입력하면 맞춤 분석보고서를 만듭니다.</p>
            </div>
        </header>

        <form id="assetForm" class="glass-card form-section">
            <h3 class="section-title">기본 정보</h3>
            <div class="field">
                <label for="name">이름 <span class="required">*</span></label>
                <input id="name" name="name" value="홍길동" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="age">본인 나이 <span class="required">*</span></label>
                <input id="age" name="age" type="number" min="19" max="100" value="60" required>
            </div>
            <div class="field">
                <label for="family_count">가족수 <span class="required">*</span></label>
                <input id="family_count" name="family_count" type="number" min="1" max="20" value="3" required>
            </div>
            <div class="field">
                <label for="family_ages">가족 나이 <span class="required">*</span></label>
                <input id="family_ages" name="family_ages" value="60,58,28" required>
                <small>쉼표로 구분합니다. 예: 60,58,28</small>
            </div>
            <div class="field">
                <label for="retirement_goal">은퇴목표 <span class="required">*</span></label>
                <input id="retirement_goal" name="retirement_goal" value="월 400만원 현금흐름 유지" required>
            </div>

            <h3 class="section-title">수입/지출/대출</h3>
            <div class="field">
                <label for="monthly_income">월수입 <span class="required">*</span></label>
                <input id="monthly_income" name="monthly_income" inputmode="decimal" value="4,000,000.0" required>
                <small>세후 기준 월평균 금액을 `#,###,###.#` 형식으로 입력합니다.</small>
            </div>
            <div class="field">
                <label for="monthly_expense">월지출 <span class="required">*</span></label>
                <input id="monthly_expense" name="monthly_expense" inputmode="decimal" value="3,200,000.0" required>
            </div>
            <div class="field">
                <label for="loan_balance">대출잔액 <span class="required">*</span></label>
                <input id="loan_balance" name="loan_balance" inputmode="decimal" value="300,000,000.0" required>
            </div>
            <div class="field">
                <label for="loan_interest_rate">대출금리(연 %) <span class="required">*</span></label>
                <input id="loan_interest_rate" name="loan_interest_rate" type="number" min="0" max="30" step="0.1" value="4.5" required>
            </div>
            <div class="field">
                <label for="risk_tolerance">위험성향(1~10) <span class="required">*</span></label>
                <input id="risk_tolerance" name="risk_tolerance" type="number" min="1" max="10" value="5" required>
                <small>1은 안정형, 10은 공격형입니다.</small>
            </div>

            <h3 class="section-title">자산 현황</h3>
            <div class="field">
                <label for="real_estate">부동산 <span class="required">*</span></label>
                <input id="real_estate" name="real_estate" inputmode="decimal" value="1,600,000,000.0" required>
            </div>
            <div class="field">
                <label for="deposit">예금 <span class="required">*</span></label>
                <input id="deposit" name="deposit" inputmode="decimal" value="120,000,000.0" required>
            </div>
            <div class="field">
                <label for="stock">주식 <span class="required">*</span></label>
                <input id="stock" name="stock" inputmode="decimal" value="60,000,000.0" required>
            </div>
            <div class="field">
                <label for="gold_silver">금/은 <span class="required">*</span></label>
                <input id="gold_silver" name="gold_silver" inputmode="decimal" value="20,000,000.0" required>
            </div>
            <div class="field">
                <label for="pension">연금 <span class="required">*</span></label>
                <input id="pension" name="pension" inputmode="decimal" value="180,000,000.0" required>
            </div>

            <button class="submit-button" type="submit">분석보고서 만들기</button>
        </form>

        <div id="resultCard" class="glass-card" style="display: none; margin-bottom: 120px;">
            <h3 style="font-size: 16px; margin-bottom: 12px;">분석보고서</h3>
            <div id="resultBody" style="font-size: 13px; line-height: 1.7;"></div>
        </div>

        <nav class="nav-bar">
            <div class="nav-item" onclick="location.href='index.html'">⌂ <span>홈</span></div>
            <div class="nav-item active" onclick="location.href='asset-input.html'">＋ <span>입력</span></div>
            <div class="nav-item" onclick="location.href='analysis.html'">▣ <span>분석</span></div>
            <div class="nav-item" onclick="location.href='recommendation.html'">◎ <span>추천</span></div>
        </nav>
    </div>

    <script>
        const form = document.getElementById('assetForm');
        const resultCard = document.getElementById('resultCard');
        const resultBody = document.getElementById('resultBody');

        const decimalFormatter = new Intl.NumberFormat('en-US', {
            minimumFractionDigits: 1,
            maximumFractionDigits: 1
        });

        function numberOf(formData, key) {
            return Number(String(formData.get(key) || 0).replace(/,/g, ''));
        }

        function agesOf(value) {
            return String(value || '').split(',').map((age) => Number(age.trim())).filter((age) => age > 0);
        }

        function won(value) {
            return `${decimalFormatter.format(Number(value || 0))}원`;
        }

        document.querySelectorAll('input[inputmode="decimal"]').forEach((input) => {
            input.addEventListener('blur', () => {
                const value = Number(String(input.value || 0).replace(/,/g, ''));
                input.value = Number.isFinite(value) ? decimalFormatter.format(value) : '0.0';
            });
            input.addEventListener('focus', () => {
                input.select();
            });
        });

        function pct(value) {
            return `${decimalFormatter.format(Number(value || 0))}%`;
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const data = new FormData(form);
            const familyAges = agesOf(data.get('family_ages'));
            const familyCount = numberOf(data, 'family_count');

            if (familyAges.length !== familyCount) {
                resultBody.textContent = `가족수는 ${familyCount}명인데 가족 나이는 ${familyAges.length}개입니다. 가족 나이를 가족수만큼 입력해 주세요.`;
                resultCard.style.display = 'block';
                resultCard.scrollIntoView({behavior: 'smooth', block: 'start'});
                return;
            }

            const payload = {
                name: data.get('name'),
                age: numberOf(data, 'age'),
                monthly_income: numberOf(data, 'monthly_income'),
                monthly_expense: numberOf(data, 'monthly_expense'),
                loan_balance: numberOf(data, 'loan_balance'),
                loan_interest_rate: numberOf(data, 'loan_interest_rate'),
                family_count: familyCount,
                family_ages: familyAges,
                retirement_goal: data.get('retirement_goal'),
                risk_tolerance: numberOf(data, 'risk_tolerance'),
                assets: [
                    {asset_type: 'real_estate', asset_name: '부동산', current_value: numberOf(data, 'real_estate')},
                    {asset_type: 'deposit', asset_name: '예금', current_value: numberOf(data, 'deposit')},
                    {asset_type: 'stock', asset_name: '주식', current_value: numberOf(data, 'stock')},
                    {asset_type: 'gold_silver', asset_name: '금/은', current_value: numberOf(data, 'gold_silver')},
                    {asset_type: 'pension', asset_name: '연금', current_value: numberOf(data, 'pension')}
                ]
            };

            const response = await fetch('/api/v1/users/analysis-input', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            const report = await response.json();

            if (!response.ok) {
                resultBody.textContent = report.detail || '분석에 실패했습니다.';
                resultCard.style.display = 'block';
                resultCard.scrollIntoView({behavior: 'smooth', block: 'start'});
                return;
            }

            const summary = report.summary;
            const analysis = report.analysis_report;
            const simulation = report.simulation;
            const breakdown = Object.entries(summary.asset_breakdown).map(([label, item]) => `<li>${label}: ${won(item.value)} (${pct(item.ratio)})</li>`).join('');
            const risks = analysis.risk_flags.map((item) => `<li>${item}</li>`).join('');
            const plan = report.recommendation.action_plan.map((item) => `<li>${item}</li>`).join('');
            resultBody.innerHTML = `
                <p><b>${analysis.headline}</b></p>
                <p><b>상태</b>: ${analysis.status} / 건전성 ${summary.health_score}/100</p>
                <p>${analysis.asset_comment}</p>
                <ul class="report-list">${breakdown}</ul>
                <p>${analysis.cashflow_comment}</p>
                <p>${analysis.debt_comment}</p>
                <p><b>가족</b>: ${analysis.family_comment}</p>
                <p><b>은퇴목표</b>: ${analysis.retirement_goal_comment}</p>
                <p><b>30년 자산 생존확률</b>: ${pct(simulation.survival_probability)}</p>
                <p style="margin-top: 10px;"><b>위험 체크</b></p>
                <ul class="report-list">${risks}</ul>
                <p><b>실행 제안</b></p>
                <ul class="report-list">${plan}</ul>
            `;
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({behavior: 'smooth', block: 'start'});
        });
    </script>
</body>
</html>
