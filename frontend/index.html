<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자산균형 - AI 리밸런싱 플랫폼</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- 헤더 영역 -->
        <header>
            <div class="greeting">
                <h1>👋 홍길동님</h1>
                <p>오늘의 자산 리포트가 도착했습니다.</p>
            </div>
        </header>

        <!-- 핵심 요약: AI 점수 -->
        <div class="glass-card score-card">
            <div class="score-container">
                <div class="score-circle">
                    <span class="score-val">72</span>
                    <span class="score-total">/100</span>
                </div>
                <div>
                    <h3 style="font-weight: 600;">자산 건전성: 양호</h3>
                    <p style="font-size: 13px; opacity: 0.9;">부동산 비중 조정이 필요합니다.</p>
                </div>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <!-- 자산 현황 요약 -->
        <div class="glass-card">
            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px;">
                <div>
                    <p style="font-size: 13px; color: var(--text-muted);">💰 총 자산</p>
                    <p style="font-size: 24px; font-weight: 800;">8억 2,500만원</p>
                </div>
                <p style="color: var(--danger); font-size: 14px; font-weight: 600;">▼ 1,200만원</p>
            </div>
            
            <div class="asset-list" style="display: flex; flex-direction: column; gap: 12px;">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 8px; height: 30px; background: var(--primary); border-radius: 4px;"></div>
                    <div style="flex: 1;">
                        <p style="font-size: 12px; color: var(--text-muted);">부동산 (72%)</p>
                        <div style="height: 6px; background: #F1F5F9; border-radius: 3px; margin-top: 4px;">
                            <div style="width: 72%; height: 100%; background: var(--primary); border-radius: 3px;"></div>
                        </div>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div style="width: 8px; height: 30px; background: var(--secondary); border-radius: 4px;"></div>
                    <div style="flex: 1;">
                        <p style="font-size: 12px; color: var(--text-muted);">금융 (18%)</p>
                        <div style="height: 6px; background: #F1F5F9; border-radius: 3px; margin-top: 4px;">
                            <div style="width: 18%; height: 100%; background: var(--secondary); border-radius: 3px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 긴급 알림 -->
        <div class="glass-card" style="border-left: 5px solid var(--danger); padding-left: 20px;">
            <p style="color: var(--danger); font-weight: 800; font-size: 14px; margin-bottom: 4px;">⚠️ 긴급 알림</p>
            <p style="font-size: 13px; line-height: 1.5;">대출 금리가 시장 평균보다 높습니다.<br>저금리 대환대출을 검토하세요.</p>
        </div>

        <!-- 네비게이션 바 -->
        <div class="glass-card" style="margin-bottom: 110px;">
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 12px;">실제 입력 분석</p>
            <button onclick="location.href='asset-input.html'" style="border: 0; width: 100%; background: var(--primary); color: white; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer;">내 자산 입력하기</button>
        </div>

        <nav class="nav-bar">
            <div class="nav-item active" onclick="location.href='index.html'">🏠 <span>홈</span></div>
            <div class="nav-item" onclick="location.href='analysis.html'">📊 <span>분석</span></div>
            <div class="nav-item" onclick="location.href='recommendation.html'">🎯 <span>추천</span></div>
            <div class="nav-item" onclick="location.href='region.html'">🗺 <span>지역</span></div>
            <div class="nav-item" onclick="location.href='settings.html'">👤 <span>MY</span></div>
        </nav>
    </div>
</body>
</html>
